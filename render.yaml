services:
  - type: web
    name: sarkarseva-v2-api
    runtime: python
    plan: free
    region: singapore
    branch: sarkarseva-v2
    rootDir: services/api
    buildCommand: pip install -r requirements.lock && pip install --no-deps .
    startCommand: alembic upgrade head && python -m app.cli.prepare_catalogue && uvicorn app.main:app --host 0.0.0.0 --port $PORT --no-access-log
    healthCheckPath: /ready
    autoDeployTrigger: 'off'
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.14"
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: LOG_LEVEL
        value: INFO
      - key: SESSION_TTL_HOURS
        value: "24"
